name: Delete probe-tmp dist-tag (one-off)

on:
  workflow_dispatch:

jobs:
  del:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Show dist-tags before
        run: npm dist-tag ls @leisureyu/dsh-aria2-win32-x64

      - name: Try CLI removal
        id: cli
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm dist-tag rm @leisureyu/dsh-aria2-win32-x64 probe-tmp

      - name: Try registry API DELETE if CLI failed
        if: steps.cli.outcome == 'failure'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $NPM_TOKEN" \
            "https://registry.npmjs.org/-/package/@leisureyu%2fdsh-aria2-win32-x64/dist-tags/probe-tmp")
          echo "HTTP $code"
          head -c 600 /tmp/out.txt
          echo

      - name: Show dist-tags after
        run: npm dist-tag ls @leisureyu/dsh-aria2-win32-x64