name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # OIDC：npm trusted publishing 必需，不再需要任何长期 token

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm CLI supports trusted publishing (>= 11.5.1)
        shell: bash
        run: |
          npm install -g npm@latest
          npm --version

      - name: Download aria2 binary for Windows x64
        shell: pwsh
        run: |
          $version = "1.37.0"
          $url = "https://github.com/aria2/aria2/releases/download/release-$version/aria2-$version-win-64bit-build1.zip"
          Invoke-WebRequest -Uri $url -OutFile aria2.zip
          Expand-Archive aria2.zip -DestinationPath aria2-tmp
          New-Item -ItemType Directory -Force -Path packages/aria2-win32-x64/bin | Out-Null
          Copy-Item "aria2-tmp/aria2-$version-win-64bit-build1/aria2c.exe" "packages/aria2-win32-x64/bin/aria2c.exe"

      - name: Install dependencies
        # aria2 子包为 optionalDependencies，此刻尚未发布，解析失败会被 pnpm 跳过，不阻断安装
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # 认证走 npm trusted publishing（OIDC），不需要 NPM_TOKEN。
      # npm 网页侧前置条件（每个「包」单独配置，且必须勾选允许直接 npm publish）：
      #   @leisureyu/dsh-smart-dl        → Settings → Trusted Publisher
      #   @leisureyu/dsh-aria2-win32-x64 → Settings → Trusted Publisher
      #   Organization or user: LeiSureYu ；Repository: dsh-smart-download ；Workflow: publish.yml
      - name: Publish subpackage
        # 子包（aria2 二进制）只在版本真正变化时才需要发布；已存在则跳过，
        # 否则会因 "Cannot publish over previously published version" 让整条流水线失败。
        working-directory: packages/aria2-win32-x64
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "skip: $name@$ver already published"
          else
            npm publish --access public
          fi

      - name: Publish main package
        # 必须在子包发布成功后再发布主包，因为主包依赖该子包
        run: npm publish --access public
