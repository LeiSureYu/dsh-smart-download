name: Unpublish probe (one-off)

# 一次性诊断：把 npm unpublish 的原始输出回写成文件推回来，便于在无 admin 权限下读取报错。
# 用完即删。

on:
  push:
    paths:
      - '.github/workflows/unpublish-broken.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Try unpublish, capture raw output
        shell: bash
        run: |
          {
            echo "== npm version =="
            npm --version
            echo
            echo "== whoami =="
            npm whoami 2>&1 || true
            echo
            for v in 0.1.1 0.1.3 0.1.4; do
              echo "== unpublish @leisureyu/dsh-smart-dl@$v =="
              npm unpublish "@leisureyu/dsh-smart-dl@$v" --force 2>&1 || true
              echo
            done
            echo "== remaining versions =="
            npm view @leisureyu/dsh-smart-dl versions 2>&1 || true
          } > ci-unpublish-log.txt 2>&1
          cat ci-unpublish-log.txt
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push log back
        shell: bash
        run: |
          git config user.name "ci-probe"
          git config user.email "ci-probe@users.noreply.github.com"
          git add ci-unpublish-log.txt
          git commit -m "ci: unpublish probe log [skip ci]" || echo "nothing to commit"
          git push origin HEAD:main
