# 临时验证 workflow（仅存在于 PR 分支，squash 合并后不会落在 main 上）：
# 在真实 Linux 环境复现 Issue #17 的 644 tarball，验证 npm / pnpm 的
# bin-links 会按 package.json 的 bin 字段把目标文件补回 755。
name: verify bin-links exec-bit restore (temp)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: bin-links restores 755 (ubuntu, npm + pnpm)
    runs-on: ubuntu-latest
    steps:
      - name: Reproduce Issue #17 tarball and verify bin-links
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          cd "$WORK"

          # 1. 取已发布的 linux-x64@1.37.0 子包 tarball（含真实二进制）
          npm pack @leisureyu/dsh-aria2-linux-x64@1.37.0
          T=$(ls *.tgz)
          mkdir pkg && tar -xzf "$T" -C pkg --strip-components=1

          # 2. 复现 Issue #17 形态：bin/aria2c 置为 644，并注入本次修复的 bin 字段
          chmod 644 pkg/bin/aria2c
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('pkg/package.json','utf8'));p.bin={'dsh-aria2c':'bin/aria2c'};fs.writeFileSync('pkg/package.json',JSON.stringify(p,null,2)+'\n')"
          echo "tarball 内权限（应为 644，即 issue 形态）: $(stat -c '%a' pkg/bin/aria2c)"
          test "$(stat -c '%a' pkg/bin/aria2c)" = "644"

          ( cd pkg && npm pack --silent >/dev/null )
          FIXED="$WORK/pkg/$(ls pkg | grep '\.tgz$')"

          # 3. npm 安装 → bin-links 应把目标补回 755
          mkdir proj-npm && cd proj-npm
          npm init -y >/dev/null
          npm install "$FIXED" >/dev/null
          F=node_modules/@leisureyu/dsh-aria2-linux-x64/bin/aria2c
          N=$(stat -c '%a' "$F")
          echo "npm 安装后权限: $N（期望 755）"
          test -e node_modules/.bin/dsh-aria2c
          test "$N" = "755" || { echo "NPM_BIN_LINKS_FAIL: $N"; exit 1; }
          echo "NPM_OK: bin-links 已补回 755"
          cd "$WORK"

          # 4. pnpm（v10，构建脚本默认被拦）安装 → 同样应补回 755
          mkdir proj-pnpm && cd proj-pnpm
          npm init -y >/dev/null
          npm install -g pnpm@10 >/dev/null
          pnpm add "$FIXED" >/dev/null
          P=$(stat -c '%a' node_modules/@leisureyu/dsh-aria2-linux-x64/bin/aria2c)
          echo "pnpm 安装后权限: $P（期望 755）"
          test -e node_modules/.bin/dsh-aria2c
          test "$P" = "755" || { echo "PNPM_BIN_LINKS_FAIL: $P"; exit 1; }
          echo "PNPM_OK: bin-links 已补回 755"

          echo "VERIFY_OK: npm 与 pnpm 均在安装侧把 644 补回 755"
